<div class="container">

<h2>User Registration</h2>

<form (ngSubmit)="register()">

    <input type="text"
    placeholder="Enter Name"
    [(ngModel)]="name"
    name="name"
    required>

    <input type="email"
    placeholder="Enter Email"
    [(ngModel)]="email"
    name="email"
    required>

    <input type="password"
    placeholder="Enter Password"
    [(ngModel)]="password"
    name="password"
    required>

    <button type="submit">Register</button>

</form>

</div>
